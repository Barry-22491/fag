databases:
  - name: fag-db
    plan: basic-256mb
    region: frankfurt
    databaseName: fag

services:
  - type: web
    name: fag
    runtime: python
    plan: starter
    region: frankfurt
    healthCheckPath: /health/
    buildCommand: bash build.sh
    startCommand: gunicorn fag.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    disk:
      name: fag-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fag-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SITE_DOMAIN
        value: fag-nrw.de
      - key: SITE_URL
        value: https://fag-nrw.de
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: cron
    name: fag-cotisations
    runtime: python
    region: frankfurt
    schedule: "0 1 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py generer_cotisations
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: fag
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: fag-db
          property: connectionString
      - key: EMAIL_HOST_PASSWORD
        fromService:
          type: web
          name: fag
          envVarKey: EMAIL_HOST_PASSWORD
      - key: SITE_DOMAIN
        value: fag-nrw.de
      - key: SITE_URL
        value: https://fag-nrw.de
