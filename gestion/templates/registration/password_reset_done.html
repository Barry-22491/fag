{% extends 'base.html' %}
{% block title %}Email envoyé{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm mt-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Vérifiez votre boîte mail</h1>
        <p class="text-muted mb-0">
          Si un compte correspond à cet email, un lien pour choisir le mot de passe vient d'être envoyé.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-4">Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
